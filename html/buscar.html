<section class="liga-section" style="padding-top:42px;min-height:65vh"><div class="container-lg">
<h2 class="liga-section-title">Resultados de búsqueda</h2>
<div id="busqueda-resumen" class="text-muted mb-4"></div>
<div class="row" id="busqueda-resultados"><div class="col-12 text-center text-muted py-5">Buscando...</div></div>
</div></section>
<footer class="liga-footer"><div class="container-lg"><div class="liga-copyright text-center">&copy; 2026 Liga Provincial de Futsal Vaca Diez #1 &mdash; Riberalta</div></div></footer>
<script src="js/liga-api.js?v=20261008final"></script><script src="js/buscador-publico.js"></script>
<script>
(async function(){
 const q=new URLSearchParams(location.search).get('q')||''; const term=q.toLowerCase().trim();
 const box=document.getElementById('busqueda-resultados'), resumen=document.getElementById('busqueda-resumen');
 if(!term){resumen.textContent='Escribe un equipo o partido en el buscador.'; box.innerHTML='<div class="col-12"><div class="liga-fan-empty">🔎 Busca por nombre de equipo o partido.</div></div>';return;}
 resumen.innerHTML='Buscando: <strong>'+esc(term)+'</strong>';
 const [equipos,partidos,resultados]=await Promise.all([apiGet('equipos'),apiGet('partidos'),apiGet('resultados')]);
 const mapa={};(equipos||[]).forEach(e=>mapa[e.id_equipo]=e.nombre);
 const eq=(equipos||[]).filter(e=>String(e.nombre||'').toLowerCase().includes(term));
 const ps=(partidos||[]).filter(p=>(mapa[p.id_equipo_local]+' '+mapa[p.id_equipo_visitante]+' '+(p.fecha||'')+' '+(p.jornada||'')).toLowerCase().includes(term));
 let html='';
 if(eq.length){html+='<div class="col-12"><h4 class="liga-subtitle">Equipos</h4></div>';eq.forEach(e=>html+=`<div class="col-md-4 mb-3"><a href="ficha_equipo.html?id=${e.id_equipo}" class="liga-search-card"><span class="liga-search-icon">🛡️</span><div><strong>${esc(e.nombre)}</strong><small>Ver ficha del equipo</small></div></a></div>`);}
 if(ps.length){html+='<div class="col-12 mt-3"><h4 class="liga-subtitle">Partidos</h4></div>';ps.slice(0,20).forEach(p=>{const r=(resultados||[]).find(x=>String(x.id_partido)===String(p.id_partido));html+=`<div class="col-md-6 mb-3"><a href="partido.html?id=${p.id_partido}" class="liga-search-card"><span class="liga-search-icon">⚽</span><div><strong>${esc(mapa[p.id_equipo_local]||'Local')} <span class="liga-search-vs">${r?esc(r.goles_local+' - '+r.goles_visitante):'vs'}</span> ${esc(mapa[p.id_equipo_visitante]||'Visitante')}</strong><small>${esc(p.fecha||'Fecha por confirmar')} · Jornada ${esc(p.jornada||'-')} · Ver partido</small></div></a></div>`;});}
 if(!html) html='<div class="col-12"><div class="liga-fan-empty">No encontramos resultados para <strong>'+esc(q)+'</strong>.</div></div>';
 box.innerHTML=html;
 function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
})();
</script>
